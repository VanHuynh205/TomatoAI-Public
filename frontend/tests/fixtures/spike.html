<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
    <title>Tomato — bản thử đóng gói</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", system-ui, sans-serif; color: #203224; background: #f5f7f3; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: clamp(24px, 5vw, 48px); font-size: 18px; line-height: 1.6; }
      main { max-width: 68ch; margin-inline: auto; }
      h1 { margin: 0 0 16px; font-size: clamp(28px, 4vw, 36px); line-height: 1.25; font-weight: 650; text-wrap: balance; }
      p { margin: 0; }
      figure { margin: 32px 0; }
      img { display: block; width: 100%; max-width: 640px; height: auto; border: 1px solid #b3c2b4; }
      figcaption { max-width: 65ch; margin-top: 12px; color: #425646; font-size: 16px; }
      footer { padding-top: 20px; border-top: 1px solid #b3c2b4; }
      ::selection { color: #fff; background: #255335; }
    </style>
  </head>
  <body>
    <main>
      <h1>Bản thử đóng gói – chưa có mô hình bệnh</h1>
      <p>Trang thử dùng để kiểm tra chữ tiếng Việt và ảnh trong cửa sổ ứng dụng Windows.</p>
      <figure>
        <img src="spike.png" width="640" height="320" alt="Ảnh kiểm tra tự tạo: các khối màu xanh, đỏ, vàng và nền ô sáng tối.">
        <figcaption>Ảnh hình học tự tạo bằng Pillow, chỉ dành cho thử đóng gói. Đây không phải ảnh bệnh hoặc kết quả nhận diện.</figcaption>
      </figure>
      <footer>
        <p>Bản thử chưa nhận ảnh người dùng, chưa phân loại bệnh và chưa cung cấp hướng dẫn chăm sóc.</p>
      </footer>
    </main>
  </body>
</html>
